# OriginGate messages in MiniMessage format: https://docs.advntr.dev/minimessage/format.html
# Run "origingate reload" after editing.
#
# Placeholders:
#   <username> <uuid> <ip> <rule> <time> (unix seconds)
#   <provider> <organisation> <country> <country_code> <city> <region> <type>
# <organisation> shows the VPN operator's name when known, otherwise the network organisation.
# Unknown values show as "-".

kick:
  deny-addresses: |-
    <red>Your connection is not allowed on this server.</red>

    <white>Contact the server staff if you think this is a mistake.</white>

    <yellow>Username: <username></yellow>
    <gray>Time: <time></gray>
  vpn: |-
    <red>VPN connections are not allowed.</red>

    <yellow><provider> / <organisation></yellow>
    <yellow>(<country>, <city>)</yellow>

    <white>Turn off your VPN and join again.</white>
    <white>Contact the server staff if you think this is a mistake.</white>

    <yellow>Username: <username></yellow>
    <gray>Time: <time></gray>
  proxy: |-
    <red>Proxy connections are not allowed.</red>

    <yellow><provider> / <organisation></yellow>
    <yellow>(<country>, <city>)</yellow>

    <white>Contact the server staff if you think this is a mistake.</white>

    <yellow>Username: <username></yellow>
    <gray>Time: <time></gray>
  country: |-
    <red>Connections from your country (<country>) are not allowed.</red>

    <white>Contact the server staff if you think this is a mistake.</white>

    <yellow>Username: <username></yellow>
    <gray>Time: <time></gray>
  lookup-failure: |-
    <red>Your connection could not be checked right now.</red>

    <white>Please join again in a moment.</white>

    <yellow>Username: <username></yellow>
    <gray>Time: <time></gray>

# Sent in chat to a player who was let in through a rule's bypass permission. Leave empty to turn off.
bypass-notice: "<light_purple>You joined with a <rule> check bypass.</light_purple>"

# Sent to online staff with an alert permission (see config.yml). Leave empty to turn off.
alerts:
  denied: "<dark_gray>[<gold>OriginGate</gold>]</dark_gray> <red>Kicked</red> <yellow><username></yellow> <gray>by the <rule> rule: <provider> / <organisation>, <country></gray>"
  bypassed: "<dark_gray>[<gold>OriginGate</gold>]</dark_gray> <green>Let in</green> <yellow><username></yellow> <gray>with a <rule> bypass: <provider> / <organisation>, <country></gray>"
