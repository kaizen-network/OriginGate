name: OriginGate
version: '${version}'
main: io.github.origingate.bukkit.OriginGateBukkit
api-version: '1.13'
description: VPN, proxy, and country checks before joining
author: Kaizen Network
softdepend: [LuckPerms]
commands:
  origingate:
    description: Inspect connections and manage OriginGate
    usage: /origingate <check|status|reload|cache|allow|deny>
permissions:
  origingate.command.check:
    default: op
  origingate.command.status:
    default: op
  origingate.command.reload:
    default: op
  origingate.command.cache:
    default: op
  origingate.command.allow:
    default: op
  origingate.command.deny:
    default: op
  origingate.bypass.vpn:
    default: false
  origingate.bypass.proxy:
    default: false
  origingate.bypass.hosting:
    default: false
  origingate.bypass.deny-networks:
    default: false
  origingate.bypass.country:
    default: false
  origingate.bypass.deny-addresses:
    default: false
